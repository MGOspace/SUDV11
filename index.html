<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDV11</title>
  <meta name="description" content="Site SUDV11">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header : PLANNING à gauche, play + statut à droite -->
  <header class="header">
    <button class="planning-link" id="planningLink" type="button"
            aria-expanded="false" aria-controls="planningFigure">PLANNING</button>
    <div class="header-right">
      <button class="play-btn" id="playBtn" type="button" aria-label="Lancer le live">
        <span class="play-icon"></span>
      </button>
      <div class="status-box" id="statusBox"></div>
    </div>
  </header>

  <!-- Planning : panneau ouvert par le bouton du header -->
  <figure class="planning-figure" id="planningFigure" hidden>
    <img src="assets/planningia.png" alt="Planning de la semaine" loading="lazy">
  </figure>

  <!-- Second marquee : texte défilant depuis une channel Are.na -->
  <div class="ticker" id="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <main class="stage">
    <h1 class="title">SUDV11</h1>
    <!-- Photos Are.na : tailles variables, dérive lente, clic = vue en grand -->
    <div class="field" id="field"></div>
  </main>

  <!-- Bandeau images Are.na : replié par défaut, dépliable via le + -->
  <aside class="rail" id="rail" data-open="false">
    <button class="rail-toggle" id="railToggle" type="button"
            aria-expanded="false" aria-controls="railBody" aria-label="Déplier les images">
      <span class="rail-toggle-icon"></span>
    </button>
    <div class="rail-body" id="railBody">
      <div class="rail-head">
        <span>IMAGES</span>
        <span class="rail-count" id="railCount"></span>
      </div>
      <div class="rail-grid" id="railGrid"></div>
    </div>
  </aside>

  <!-- Image en grand -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-nav">
      <button type="button" id="lbPrev" aria-label="Image précédente">&#8592;</button>
      <button type="button" id="lbNext" aria-label="Image suivante">&#8594;</button>
      <button type="button" id="lbClose" aria-label="Fermer">&#215;</button>
    </div>
    <figure>
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
  </div>

  <!-- Player live monté ici (hors-écran) -->
  <div class="player-mount" id="playerMount"></div>

  <!-- Affichage / masquage du panneau planning -->
  <script>
    (function () {
      var link = document.getElementById("planningLink");
      var figure = document.getElementById("planningFigure");

      function setOpen(open) {
        figure.hidden = !open;
        link.classList.toggle("is-open", open);
        link.setAttribute("aria-expanded", open ? "true" : "false");
      }

      link.addEventListener("click", function () { setOpen(figure.hidden); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !figure.hidden) setOpen(false);
      });
    })();
  </script>

  <!-- Live Mixcloud (M_GO) : box = état réel du stream, play = son HLS dans le navigateur -->
  <script>
    (function () {
      // Cloudflare Worker (voir worker/mixcloud-live.js) : renvoie { live, src }
      // où src est le flux audio HLS proxifié (CORS ok), prêt à jouer.
      var STATUS_ENDPOINT = "https://sudv11-live.guerreiromathis.workers.dev/";
      var HLSJS_URL = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";

      var statusBox = document.getElementById("statusBox");
      var playBtn = document.getElementById("playBtn");
      var mount = document.getElementById("playerMount");

      var isOnline = false;   // stream Mixcloud réellement en ligne
      var currentSrc = null;  // URL du flux HLS à jouer (via le Worker)
      var playing = false;
      var audio = null;
      var hls = null;
      var hlsLoading = null;
      function noop() {}

      function nativeHls() {
        var a = document.createElement("audio");
        return !!a.canPlayType && !!a.canPlayType("application/vnd.apple.mpegurl");
      }

      function loadHlsJs(cb) {
        if (window.Hls) { cb(); return; }
        if (hlsLoading) { hlsLoading.push(cb); return; }
        hlsLoading = [cb];
        var s = document.createElement("script");
        s.src = HLSJS_URL;
        s.onload = function () { var q = hlsLoading; hlsLoading = null; q.forEach(function (f) { f(); }); };
        s.onerror = function () { hlsLoading = null; };
        document.head.appendChild(s);
      }

      function setBadge(online) {
        statusBox.classList.toggle("is-live", online);
        statusBox.innerHTML = online ? '<span class="live-dot"></span>LIVE' : "OFFLINE";
      }

      function play() {
        if (!isOnline || !currentSrc) return;
        audio = document.createElement("audio");
        audio.autoplay = true;
        audio.preload = "auto";
        mount.appendChild(audio);

        playing = true;
        playBtn.classList.add("is-playing");
        playBtn.setAttribute("aria-label", "Arrêter le live");

        if (nativeHls()) {
          audio.src = currentSrc;          // Safari / iOS : HLS natif
          audio.play().catch(noop);
        } else {
          loadHlsJs(function () {           // Chrome / Firefox / Android : hls.js
            if (!window.Hls || !playing || !audio) return;
            hls = new window.Hls({ liveDurationInfinity: true });
            hls.loadSource(currentSrc);
            hls.attachMedia(audio);
            hls.on(window.Hls.Events.MANIFEST_PARSED, function () { audio.play().catch(noop); });
          });
        }
      }

      function stop() {
        if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
        if (audio) { try { audio.pause(); } catch (e) {} }
        mount.innerHTML = "";
        audio = null;
        playing = false;
        playBtn.classList.remove("is-playing");
        playBtn.setAttribute("aria-label", "Lancer le live");
      }

      playBtn.addEventListener("click", function () {
        if (playing) { stop(); } else { play(); }
      });

      function setOnline(online, src) {
        isOnline = online;
        currentSrc = src || null;
        setBadge(online);
        playBtn.disabled = !online;         // play grisé si offline
        if (!online && playing) { stop(); } // coupe si le live s'arrête
        // Précharge hls.js dès qu'on est online (si nécessaire) pour un play instantané
        if (online && !nativeHls()) { loadHlsJs(noop); }
      }

      setOnline(false); // état initial

      function checkLive() {
        fetch(STATUS_ENDPOINT, { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) { setOnline(!!(d && d.live), d && d.src); })
          .catch(function () { /* on garde le dernier état connu */ });
      }

      checkLive();
      setInterval(checkLive, 30000); // re-vérifie toutes les 30 s
    })();
  </script>

  <!-- Marquee Are.na : récupère les blocs texte d'une channel et les fait défiler -->
  <script>
    (function () {
      // Slug de la channel Are.na (are.na/m-go-lq0qmuopbtu/texte_sudv11)
      var CHANNEL = "texte_sudv11";
      var SPEED = 40; // px/seconde — plus petit = plus lent

      var track = document.getElementById("tickerTrack");

      function esc(s) {
        return s.replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function build(items) {
        if (!items.length) items = ["SUDV11"];
        var unit = items.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("");
        track.innerHTML = unit + unit; // deux copies -> boucle sans coupure (-50%)
        // vitesse constante quel que soit le volume de texte
        var half = track.scrollWidth / 2;
        track.style.animationDuration = (half / SPEED) + "s";
      }

      if (!CHANNEL) { build([]); return; }

      fetch("https://api.are.na/v2/channels/" + CHANNEL + "/contents?per=100")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var texts = (d.contents || [])
            .filter(function (b) { return b.class === "Text"; })
            .map(function (b) { return (b.content || "").replace(/\s+/g, " ").trim(); })
            .filter(Boolean);
          build(texts);
        })
        .catch(function () { build([]); });
    })();
  </script>

  <!-- Rail Are.na : blocs image d'une channel, dépliable + vue en grand -->
  <script>
    (function () {
      // Slug de la channel Are.na (are.na/m-go-lq0qmuopbtu/image_sudv11)
      var CHANNEL = "image_sudv11";
      var POLL = 60000; // rafraîchit la channel toutes les 60 s

      var rail = document.getElementById("rail");
      var toggle = document.getElementById("railToggle");
      var grid = document.getElementById("railGrid");
      var count = document.getElementById("railCount");

      var lightbox = document.getElementById("lightbox");
      var lbImg = document.getElementById("lbImg");
      var lbCap = document.getElementById("lbCap");

      var field = document.getElementById("field");

      var items = [];    // { thumb, full, title }
      var index = -1;    // image ouverte en grand
      var signature = ""; // évite de reconstruire la grille pour rien

      /* ---- rail ouvert / fermé ---- */
      function setOpen(open) {
        rail.dataset.open = open ? "true" : "false";
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.setAttribute("aria-label", open ? "Replier les images" : "Déplier les images");
      }
      toggle.addEventListener("click", function () {
        setOpen(rail.dataset.open !== "true");
      });

      /* ---- vue en grand ---- */
      function open(i) {
        if (!items.length) return;
        index = (i + items.length) % items.length;
        var it = items[index];
        lbImg.src = it.full;
        lbImg.alt = it.title || "Image Are.na";
        lbCap.textContent = it.title || "";
        lightbox.hidden = false;
      }
      function close() {
        lightbox.hidden = true;
        lbImg.removeAttribute("src");
        index = -1;
      }
      document.getElementById("lbClose").addEventListener("click", close);
      document.getElementById("lbPrev").addEventListener("click", function (e) {
        e.stopPropagation(); open(index - 1);
      });
      document.getElementById("lbNext").addEventListener("click", function (e) {
        e.stopPropagation(); open(index + 1);
      });
      lightbox.addEventListener("click", function (e) {
        if (e.target === lightbox || e.target.tagName === "FIGURE") close();
      });
      document.addEventListener("keydown", function (e) {
        if (lightbox.hidden) return;
        if (e.key === "Escape") close();
        else if (e.key === "ArrowLeft") open(index - 1);
        else if (e.key === "ArrowRight") open(index + 1);
      });

      /* ---- champ de photos (page principale) ---- */

      // Pseudo-aléatoire déterministe : la mise en page ne saute pas d'un rendu à l'autre
      function rnd(n) {
        var x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function layout() {
        var w = window.innerWidth;
        if (w < 700) return { cols: 3, rows: 5 };
        if (w < 1100) return { cols: 4, rows: 4 };
        return { cols: 5, rows: 4 };
      }

      function renderField() {
        var L = layout();
        var cw = 100 / L.cols;
        var ch = 100 / L.rows;
        var cellW = field.clientWidth / L.cols;
        var maxH = (field.clientHeight / L.rows) * 0.82;   // aucune image ne déborde de sa case
        field.innerHTML = "";

        items.slice(0, L.cols * L.rows).forEach(function (it, i) {
          var col = i % L.cols;
          var row = Math.floor(i / L.cols);
          var w = cellW * (0.34 + rnd(i + 17) * 0.38);     // tailles différentes

          // une case par image, décalée au hasard : grille lisible mais jamais alignée
          var slot = document.createElement("div");
          slot.className = "photo-slot";
          slot.style.left = (cw * (col + 0.5) + (rnd(i + 1) - 0.5) * cw * 0.34) + "%";
          slot.style.top = (ch * (row + 0.5) + (rnd(i + 9) - 0.5) * ch * 0.34) + "%";
          slot.style.width = w + "px";
          slot.style.zIndex = String(2 + (i % 5));

          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "photo";
          btn.title = it.title || "";
          btn.setAttribute("aria-label", it.title || "Agrandir l'image");
          // dérive lente, propre à chaque image
          btn.style.setProperty("--dx", (6 + rnd(i + 23) * 16).toFixed(1) + "px");
          btn.style.setProperty("--dy", (6 + rnd(i + 31) * 16).toFixed(1) + "px");
          btn.style.setProperty("--r", ((rnd(i + 41) - 0.5) * 3).toFixed(2) + "deg");
          btn.style.animationDuration = (48 + rnd(i + 53) * 46).toFixed(1) + "s";
          btn.style.animationDelay = "-" + (rnd(i + 67) * 40).toFixed(1) + "s";

          var img = document.createElement("img");
          // une fois les proportions connues, on rétrécit les portraits pour rester dans la case
          img.addEventListener("load", function () {
            if (!img.naturalWidth || !img.naturalHeight) return;
            var ratio = img.naturalHeight / img.naturalWidth;
            if (w * ratio > maxH) slot.style.width = (maxH / ratio) + "px";
          });
          img.src = it.mid;
          img.alt = it.title || "";
          img.loading = "lazy";
          btn.appendChild(img);
          btn.addEventListener("click", function () { open(i); });

          slot.appendChild(btn);
          field.appendChild(slot);
        });
      }

      var resizeT = null;
      window.addEventListener("resize", function () {
        clearTimeout(resizeT);
        resizeT = setTimeout(renderField, 200);
      });

      /* ---- grille ---- */
      function render() {
        renderField();
        count.textContent = items.length ? String(items.length) : "";
        if (!items.length) {
          grid.innerHTML = '<p class="rail-empty">Aucune image pour le moment. Connecte une image à la channel Are.na image_SUDV11.</p>';
          return;
        }
        grid.innerHTML = "";
        items.forEach(function (it, i) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "rail-thumb";
          btn.title = it.title || "";
          var img = document.createElement("img");
          img.src = it.thumb;
          img.alt = it.title || "";
          img.loading = "lazy";
          btn.appendChild(img);
          btn.addEventListener("click", function () { open(i); });
          grid.appendChild(btn);
        });
      }

      /* ---- Are.na ---- */
      function pick(b) {
        var im = b.image;
        if (!im) return null; // garde les blocs Image, mais aussi Link/Media qui portent une image
        var thumb = (im.thumb && im.thumb.url) || (im.display && im.display.url);
        var full = (im.large && im.large.url) || (im.display && im.display.url) || (im.original && im.original.url);
        if (!thumb || !full) return null;
        var mid = (im.display && im.display.url) || full;
        return { thumb: thumb, mid: mid, full: full, title: (b.title || "").trim() };
      }

      function load() {
        fetch("https://api.are.na/v2/channels/" + CHANNEL + "/contents?per=100", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var next = (d.contents || []).map(pick).filter(Boolean).reverse(); // plus récent en premier
            var sig = next.map(function (it) { return it.thumb; }).join("|");
            if (sig === signature) return;
            signature = sig;
            items = next;
            if (!lightbox.hidden) close();
            render();
          })
          .catch(function () { if (!items.length) render(); });
      }

      render();
      load();
      setInterval(load, POLL);
    })();
  </script>
