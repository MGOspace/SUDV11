<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDV11</title>
  <meta name="description" content="Site SUDV11">
  <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
  <!-- Header : PLANNING à gauche, play + statut à droite -->
  <header class="header">
    <button class="planning-link" id="planningLink" type="button"
            aria-expanded="false" aria-controls="planningFigure">PLANNING</button>
    <div class="header-right">
      <button class="play-btn" id="playBtn" type="button" aria-label="Lancer le live">
        <span class="play-icon"></span>
      </button>
      <div class="status-box" id="statusBox"></div>
    </div>
  </header>

  <!-- Planning : panneau ouvert par le bouton du header -->
  <figure class="planning-figure" id="planningFigure" hidden>
    <img src="assets/planningia.png" alt="Planning de la semaine" loading="lazy">
  </figure>

  <!-- Second marquee : texte défilant depuis une channel Are.na -->
  <div class="ticker" id="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <main class="stage">
    <!-- Le titre est un portail : les lettres sont remplies par une vue du
         plan, et le clic projette le mot vers le lecteur avant d'y entrer -->
    <canvas class="word-canvas" id="wordCanvas" aria-hidden="true"></canvas>
    <!-- Le plan est ouvert : le mot est un lien. Le clic ne suit pas le lien
         tout de suite — le script projette d'abord le mot vers le lecteur,
         puis navigue. Sans JS, le lien marche quand meme, sans l'animation.
         Sur un appareil sans souris, le plan se renvoie lui-meme a l'accueil. -->
    <a class="title" id="titlePortal" href="pics.html">SUDV11</a>
    <div class="lines" id="lines">
      <p class="tagline">ce soir <s>20h</s> 21h....</p>
      <p class="subline">sur ton ordinateur ദ്ദി(˵ •̀ ᴗ - ˵ ) ✧</p>
    </div>
  </main>

  <!-- Bandeau images Are.na : replié par défaut, dépliable via le + -->
  <aside class="rail" id="rail" data-open="false">
    <button class="rail-toggle" id="railToggle" type="button"
            aria-expanded="false" aria-controls="railBody" aria-label="Déplier les images">
      <span class="rail-toggle-icon"></span>
    </button>
    <div class="rail-body" id="railBody">
      <div class="rail-head">
        <span>IMAGES</span>
        <span class="rail-count" id="railCount"></span>
      </div>
      <div class="rail-grid" id="railGrid"></div>
    </div>
  </aside>


  <!-- Player live monté ici (hors-écran) -->
  <div class="player-mount" id="playerMount"></div>

  <!-- Affichage / masquage du panneau planning -->
  <script>
    (function () {
      var link = document.getElementById("planningLink");
      var figure = document.getElementById("planningFigure");

      function setOpen(open) {
        figure.hidden = !open;
        link.classList.toggle("is-open", open);
        link.setAttribute("aria-expanded", open ? "true" : "false");
      }

      link.addEventListener("click", function () { setOpen(figure.hidden); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !figure.hidden) setOpen(false);
      });
    })();
  </script>

  <!-- Live Mixcloud (M_GO) : box = état réel du stream, play = son HLS dans le navigateur -->
  <script>
    (function () {
      // Cloudflare Worker (voir worker/mixcloud-live.js) : renvoie { live, src }
      // où src est le flux audio HLS proxifié (CORS ok), prêt à jouer.
      var STATUS_ENDPOINT = "https://sudv11-live.guerreiromathis.workers.dev/";
      var HLSJS_URL = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";

      var statusBox = document.getElementById("statusBox");
      var playBtn = document.getElementById("playBtn");
      var mount = document.getElementById("playerMount");

      var isOnline = false;   // stream Mixcloud réellement en ligne
      var currentSrc = null;  // URL du flux HLS à jouer (via le Worker)
      var playing = false;
      var audio = null;
      var hls = null;
      var hlsLoading = null;
      function noop() {}

      function nativeHls() {
        var a = document.createElement("audio");
        return !!a.canPlayType && !!a.canPlayType("application/vnd.apple.mpegurl");
      }

      function loadHlsJs(cb) {
        if (window.Hls) { cb(); return; }
        if (hlsLoading) { hlsLoading.push(cb); return; }
        hlsLoading = [cb];
        var s = document.createElement("script");
        s.src = HLSJS_URL;
        s.onload = function () { var q = hlsLoading; hlsLoading = null; q.forEach(function (f) { f(); }); };
        s.onerror = function () { hlsLoading = null; };
        document.head.appendChild(s);
      }

      function setBadge(online) {
        statusBox.classList.toggle("is-live", online);
        statusBox.innerHTML = online ? '<span class="live-dot"></span>LIVE' : "OFFLINE";
      }

      function play() {
        if (!isOnline || !currentSrc) return;
        audio = document.createElement("audio");
        audio.autoplay = true;
        audio.preload = "auto";
        mount.appendChild(audio);

        playing = true;
        playBtn.classList.add("is-playing");
        playBtn.setAttribute("aria-label", "Arrêter le live");

        if (nativeHls()) {
          audio.src = currentSrc;          // Safari / iOS : HLS natif
          audio.play().catch(noop);
        } else {
          loadHlsJs(function () {           // Chrome / Firefox / Android : hls.js
            if (!window.Hls || !playing || !audio) return;
            hls = new window.Hls({ liveDurationInfinity: true });
            hls.loadSource(currentSrc);
            hls.attachMedia(audio);
            hls.on(window.Hls.Events.MANIFEST_PARSED, function () { audio.play().catch(noop); });
          });
        }
      }

      function stop() {
        if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
        if (audio) { try { audio.pause(); } catch (e) {} }
        mount.innerHTML = "";
        audio = null;
        playing = false;
        playBtn.classList.remove("is-playing");
        playBtn.setAttribute("aria-label", "Lancer le live");
      }

      playBtn.addEventListener("click", function () {
        if (playing) { stop(); } else { play(); }
      });

      function setOnline(online, src) {
        isOnline = online;
        currentSrc = src || null;
        setBadge(online);
        playBtn.disabled = !online;         // play grisé si offline
        if (!online && playing) { stop(); } // coupe si le live s'arrête
        // Précharge hls.js dès qu'on est online (si nécessaire) pour un play instantané
        if (online && !nativeHls()) { loadHlsJs(noop); }
      }

      setOnline(false); // état initial

      function checkLive() {
        fetch(STATUS_ENDPOINT, { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) { setOnline(!!(d && d.live), d && d.src); })
          .catch(function () { /* on garde le dernier état connu */ });
      }

      checkLive();
      setInterval(checkLive, 30000); // re-vérifie toutes les 30 s
    })();
  </script>

  <!-- Marquee Are.na : récupère les blocs texte d'une channel et les fait défiler -->
  <script>
    (function () {
      // Slug de la channel Are.na (are.na/m-go-lq0qmuopbtu/texte_sudv11)
      var CHANNEL = "texte_sudv11";
      var SPEED = 40; // px/seconde — plus petit = plus lent

      var track = document.getElementById("tickerTrack");

      function esc(s) {
        return s.replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function build(items) {
        if (!items.length) items = ["SUDV11"];
        var unit = items.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("");
        track.innerHTML = unit + unit; // deux copies -> boucle sans coupure (-50%)
        // vitesse constante quel que soit le volume de texte
        var half = track.scrollWidth / 2;
        track.style.animationDuration = (half / SPEED) + "s";
      }

      if (!CHANNEL) { build([]); return; }

      fetch("https://api.are.na/v2/channels/" + CHANNEL + "/contents?per=100")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var texts = (d.contents || [])
            .filter(function (b) { return b.class === "Text"; })
            .map(function (b) { return (b.content || "").replace(/\s+/g, " ").trim(); })
            .filter(Boolean);
          build(texts);
        })
        .catch(function () { build([]); });
    })();
  </script>

  <!-- Rail : volet droit, vide pour l'instant, dépliable via le + -->
  <script>
    (function () {
      var rail = document.getElementById("rail");
      var toggle = document.getElementById("railToggle");
      function setOpen(open) {
        rail.dataset.open = open ? "true" : "false";
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.setAttribute("aria-label", open ? "Replier le volet" : "Déplier le volet");
      }
      toggle.addEventListener("click", function () {
        setOpen(rail.dataset.open !== "true");
      });
    })();
  </script>

  <!-- Le plan vit derrière la page : des bulles dérivent en permanence, et on
       ne les voit qu'à travers les lettres. Au survol le mot gonfle lentement ;
       au clic il fonce vers le lecteur et on entre. Tout est peint dans un seul
       canvas — pas de masque CSS à tenir aligné, une seule source de vérité.

       Trois précautions gardent le gonflement fluide, car c'est là que la
       moindre dépense se voit :
       — les pastilles rondes sont découpées une fois pour toutes, et seulement
         pour les images réellement tirées : plus aucun clip par bulle et par
         image, juste un drawImage ;
       — le mot est cuit dans deux bitmaps (remplissage, contour) et redessiné
         tel quel. Peindre le texte à une taille neuve à chaque image forçait
         le navigateur à re-rasteriser les lettres 60 fois par seconde : c'était
         l'origine des à-coups. On ne recuit qu'au-delà de 1,5 % de dérive ;
       — le canvas ne couvre que la boîte du mot. Il ne passe plein écran que
         pour l'entrée, où le mot doit traverser toute la page. -->
  <script>
    (function () {
      var cv = document.getElementById("wordCanvas");
      var portal = document.getElementById("titlePortal");
      if (!cv || !portal || !cv.getContext) return;
      var ctx = cv.getContext("2d");

      var MOT = "SUDV11";
      var N = 72;            // bulles simulées : assez pour qu'aucune lettre
                             // ne se retrouve vide quand elles dérivent
      var HOVER = 1.09;      // gonflement maximal au survol
      var TAU = 0.55;        // secondes — lenteur du gonflement et du dégonflement
      var DERIVE = 11;       // px/s
      var MARGE = 10;        // px autour du mot cuit (contour + antialiasing)
      var DERIVE_MAX = 0.015; // on recuit le mot passé 1,5 % d'écart d'échelle
      var doux = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var DPR = 1, vw = 0, vh = 0;     // fenêtre
      var W = 0, H = 0;                // canvas, en px CSS
      var pageCx = 0, pageCy = 0;      // centre du mot dans la page
      var cx = 0, cy = 0;              // centre du mot dans le canvas
      var plein = false;               // canvas plein écran (entrée / retour)
      var police = 0, boxW = 0, boxH = 0;
      var trait = "#000";              // couleur du contour, lue une fois
      var S = 1, cible = 1, phase = "repos", t0 = 0, depart = 1;
      var atlas = null, meta = null, prets = false;

      // Les bulles vivent dans le repère du mot : quand il grossit, elles
      // grossissent avec lui. C'est ce qui donne la sensation d'entrer dedans
      // plutôt que de zoomer sur une image.
      var px = [], py = [], vx = [], vy = [], r = [], img = [], ph = [], w1 = [], w2 = [];
      var rond = [], utiles = [];      // pastilles découpées ; img[i] pointe dans rond

      var masque = document.createElement("canvas"), mctx = masque.getContext("2d");
      var contour = document.createElement("canvas"), cctx = contour.getContext("2d");
      var cuitS = 0, cuitW = 0, cuitH = 0;

      function applique_police(g, taille) {
        g.font = "700 " + taille + 'px "ABC Schengen C", system-ui, sans-serif';
        g.textAlign = "center";
        g.textBaseline = "middle";
        if ("letterSpacing" in g) g.letterSpacing = (taille * 0.02) + "px";
      }

      // La taille vient du CSS (.title, via clamp) : le canvas ne la recalcule
      // pas, il la lit. Ainsi le mot peint et la zone de survol ne peuvent
      // jamais diverger, et un seul reglage suffit pour les deux.
      function mesure() {
        var cs = getComputedStyle(document.documentElement);
        var hh = parseFloat(cs.getPropertyValue("--header-h")) || 64;
        var th = parseFloat(cs.getPropertyValue("--ticker-h")) || 38;
        trait = cs.getPropertyValue("--color-stroke").trim() || "#000";

        DPR = Math.min(2, window.devicePixelRatio || 1);
        vw = window.innerWidth; vh = window.innerHeight;
        police = parseFloat(getComputedStyle(portal).fontSize) || 120;
        pageCx = vw / 2;
        pageCy = hh + th + (vh - hh - th) / 2;

        applique_police(ctx, police);
        var m = ctx.measureText(MOT);
        boxW = m.width;
        var haut = m.actualBoundingBoxAscent || police * 0.72;
        var bas = m.actualBoundingBoxDescent || police * 0.28;

        // Le bitmap du mot est symétrique autour du centre : on l'agrandit
        // ensuite depuis ce centre, comme le fait le mot lui-même.
        cuitW = boxW * HOVER + MARGE * 2;
        cuitH = (Math.max(haut, bas) * HOVER + MARGE) * 2;
        masque.width = contour.width = Math.ceil(cuitW * DPR);
        masque.height = contour.height = Math.ceil(cuitH * DPR);
        cuitS = 0;                      // les bitmaps sont à refaire

        cadre();

        // la ligne du dessous suit le mot peint, pas une valeur en dur
        var lignes = document.getElementById("lines");
        if (lignes) lignes.style.top = Math.round(pageCy + police * 0.62) + "px";
      }

      // Le canvas ne couvre que ce qu'il peint. Au repos c'est la boîte du mot :
      // effacer et masquer coûtent alors quelques centaines de milliers de
      // pixels au lieu de l'écran entier.
      function cadre() {
        if (plein) {
          cv.style.cssText = "";        // on rend la main à la feuille de style
          W = vw; H = vh;
          cx = pageCx; cy = pageCy;
        } else {
          W = cuitW; H = cuitH;
          cv.style.left = (pageCx - W / 2) + "px";
          cv.style.top = (pageCy - H / 2) + "px";
          cv.style.right = "auto";
          cv.style.bottom = "auto";
          cv.style.width = W + "px";
          cv.style.height = H + "px";
          cx = W / 2; cy = H / 2;
        }
        cv.width = Math.round(W * DPR);
        cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function mode(pleinEcran) {
        if (plein === pleinEcran) return;
        plein = pleinEcran;
        cuitS = 0;
        cadre();
      }

      // Le mot cuit à l'échelle s : remplissage d'un côté (il sert de masque),
      // contour de l'autre (son épaisseur ne doit pas suivre l'échelle).
      function cuis_mot(s) {
        cuitS = s;
        applique_police(mctx, police * s);
        mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        mctx.clearRect(0, 0, cuitW, cuitH);
        mctx.fillStyle = "#000";
        mctx.fillText(MOT, cuitW / 2, cuitH / 2);

        applique_police(cctx, police * s);
        cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        cctx.clearRect(0, 0, cuitW, cuitH);
        cctx.lineWidth = 2;
        cctx.strokeStyle = trait;
        cctx.strokeText(MOT, cuitW / 2, cuitH / 2);
      }

      // Une pastille par image réellement tirée : le disque est découpé ici,
      // une fois, plutôt qu'à chaque bulle et à chaque image.
      function cuis_pastilles() {
        var SP = Math.max(64, Math.min(192, Math.ceil(police * 0.36 * HOVER * DPR)));
        var C = meta.cell;
        rond = [];
        for (var k = 0; k < utiles.length; k++) {
          var im = meta.images[utiles[k]];
          var c = document.createElement("canvas");
          c.width = c.height = SP;
          var g = c.getContext("2d");
          g.beginPath();
          g.arc(SP / 2, SP / 2, SP / 2, 0, 6.2832);
          g.clip();
          g.drawImage(atlas, im.x * C, im.y * C, C, C, 0, 0, SP, SP);
          rond.push(c);
        }
      }

      function semer() {
        var demiW = boxW * 0.58, demiH = police * 0.70;
        var vus = {};
        utiles = [];
        for (var i = 0; i < N; i++) {
          px[i] = (Math.random() * 2 - 1) * demiW;
          py[i] = (Math.random() * 2 - 1) * demiH;
          vx[i] = vy[i] = 0;
          r[i] = police * (0.22 + Math.random() * 0.14);
          var j = (Math.random() * meta.images.length) | 0;
          if (!(j in vus)) { vus[j] = utiles.length; utiles.push(j); }
          ph[i] = Math.random() * 6.283;
          w1[i] = 0.06 + Math.random() * 0.14;
          w2[i] = 0.06 + Math.random() * 0.14;
          img[i] = vus[j];
        }
      }

      function pas(dt, t) {
        var demiW = boxW * 0.58, demiH = police * 0.70;
        for (var i = 0; i < N; i++) {
          vx[i] += (Math.cos(t * w1[i] + ph[i]) * DERIVE - vx[i]) * 0.04;
          vy[i] += (Math.sin(t * w2[i] + ph[i]) * DERIVE - vy[i]) * 0.04;
          px[i] += vx[i] * dt; py[i] += vy[i] * dt;
          if (px[i] < -demiW) { px[i] = -demiW; vx[i] = Math.abs(vx[i]); }
          if (px[i] > demiW) { px[i] = demiW; vx[i] = -Math.abs(vx[i]); }
          if (py[i] < -demiH) { py[i] = -demiH; vy[i] = Math.abs(vy[i]); }
          if (py[i] > demiH) { py[i] = demiH; vy[i] = -Math.abs(vy[i]); }
        }
        // 2 500 paires par image : on écarte d'abord au carré, la racine ne
        // sert que pour les bulles qui se chevauchent vraiment
        for (var a = 0; a < N; a++) {
          for (var b = a + 1; b < N; b++) {
            var dx = px[b] - px[a], dy = py[b] - py[a], sr = r[a] + r[b];
            if (dx > sr || dx < -sr || dy > sr || dy < -sr) continue;
            var d2 = dx * dx + dy * dy;
            if (d2 >= sr * sr || d2 === 0) continue;
            var d = Math.sqrt(d2), f = (sr - d) * 0.05 / d;
            var ux = dx * f, uy = dy * f;
            px[a] -= ux; py[a] -= uy; px[b] += ux; py[b] += uy;
          }
        }
      }

      function dessine() {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        if (!prets) return;

        for (var i = 0; i < N; i++) {
          var R = r[i] * S, X = cx + px[i] * S, Y = cy + py[i] * S;
          if (X + R < 0 || X - R > W || Y + R < 0 || Y - R > H) continue;
          ctx.drawImage(rond[img[i]], X - R, Y - R, R * 2, R * 2);
        }

        // on ne garde que ce qui traverse les lettres
        if (plein) {
          // l'entrée déborde largement du bitmap cuit : on peint le mot vif
          applique_police(ctx, police * S);
          ctx.globalCompositeOperation = "destination-in";
          ctx.fillStyle = "#000";
          ctx.fillText(MOT, cx, cy);
          ctx.globalCompositeOperation = "source-over";
          // le contour garde son épaisseur quelle que soit l'échelle
          ctx.lineWidth = 2;
          ctx.strokeStyle = trait;
          ctx.strokeText(MOT, cx, cy);
        } else {
          var k = S / cuitS, w = cuitW * k, h = cuitH * k;
          var dx = cx - w / 2, dy = cy - h / 2;
          ctx.globalCompositeOperation = "destination-in";
          ctx.drawImage(masque, dx, dy, w, h);
          ctx.globalCompositeOperation = "source-over";
          ctx.drawImage(contour, dx, dy, w, h);
        }
      }

      var prec = 0;
      function boucle(now) {
        var dt = Math.min(0.05, (now - prec) / 1000); prec = now;
        if (phase === "repos") {
          S += (cible - S) * (1 - Math.exp(-dt / TAU));
        } else if (phase === "entre") {
          var k = Math.min(1, (now - t0) / 800);
          S = depart + (16 - depart) * (k * k * k);
        } else if (phase === "retour") {
          var q = Math.min(1, (now - t0) / 550);
          S = 1 + (7 - 1) * Math.pow(1 - q, 3);
          if (q >= 1) { phase = "repos"; mode(false); }
        }
        if (prets && !plein && (!cuitS || Math.abs(S / cuitS - 1) > DERIVE_MAX)) cuis_mot(S);
        pas(dt, now / 1000);
        dessine();
        requestAnimationFrame(boucle);
      }

      /* ---- survol : le mot gonfle lentement, comme une bulle ---- */
      portal.addEventListener("pointerenter", function () {
        if (phase === "repos" && !doux) cible = HOVER;
      });
      portal.addEventListener("pointerleave", function () {
        if (phase === "repos") cible = 1;
      });
      portal.addEventListener("focus", function () { if (!doux) cible = HOVER; });
      portal.addEventListener("blur", function () { cible = 1; });

      /* ---- clic : on entre dans le texte, si le plan est ouvert ---- */
      var parti = false;
      // le plan demande une souris : sur mobile le mot n'ouvre rien
      var sansSouris = !window.matchMedia("(any-hover: hover)").matches
                    || !window.matchMedia("(any-pointer: fine)").matches;
      // Sans souris, le mot n'est plus un lien du tout : on lui retire son
      // href. Sinon un doigt l'ouvrirait, et le plan le renverrait aussitot
      // ici — un aller-retour pour rien. Il reste lisible, il n'est plus une
      // porte, et les lecteurs d'ecran ne l'annoncent plus comme telle.
      if (sansSouris) {
        document.body.classList.add("no-mouse");
        portal.removeAttribute("href");
      }
      if (!sansSouris && portal.tagName === "A" && portal.getAttribute("href"))
      portal.addEventListener("click", function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
        e.preventDefault();
        if (doux) { location.href = portal.href; return; }
        document.body.classList.add("entering");
        mode(true);
        phase = "entre"; t0 = performance.now(); depart = S;
        setTimeout(function () { if (!parti) { parti = true; location.href = portal.href; } }, 820);
      });

      window.addEventListener("resize", function () {
        var avantP = police;
        mesure();
        var k = police / (avantP || police);
        for (var i = 0; i < N; i++) { px[i] *= k; py[i] *= k; r[i] *= k; }
        if (prets) cuis_pastilles();
      });

      mesure();
      var im = new Image();
      im.onload = function () {
        atlas = im;
