<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDV11</title>
  <meta name="description" content="Site SUDV11">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header : ligne du bas noire, play + statut en haut à droite -->
  <header class="header">
    <button class="play-btn" id="playBtn" type="button" aria-label="Lancer le live" disabled>
      <span class="play-icon"></span>
    </button>
    <div class="status-box" id="statusBox">OFFLINE</div>
  </header>

  <main class="stage">
    <h1 class="title">SUDV11</h1>
  </main>

  <!-- Player live monté ici (hors-écran) -->
  <div class="player-mount" id="playerMount"></div>

  <!-- Détection + lancement du live Mixcloud (M_GO) -->
  <script>
    (function () {
      var USER = "M_GO";
      var statusBox = document.getElementById("statusBox");
      var playBtn = document.getElementById("playBtn");
      var mount = document.getElementById("playerMount");
      var isLive = false;
      var playing = false;

      function play() {
        if (!isLive) return;
        mount.innerHTML =
          '<iframe width="300" height="60" allow="autoplay" ' +
          'src="https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&mini=1&autoplay=1&feed=%2Flive%2F' +
          USER + '%2F"></iframe>';
        playing = true;
        playBtn.classList.add("is-playing");
        playBtn.setAttribute("aria-label", "Arrêter le live");
      }

      function stop() {
        mount.innerHTML = "";
        playing = false;
        playBtn.classList.remove("is-playing");
        playBtn.setAttribute("aria-label", "Lancer le live");
      }

      playBtn.addEventListener("click", function () {
        if (playing) { stop(); } else { play(); }
      });

      function setStatus(live) {
        isLive = live;
        statusBox.textContent = live ? "LIVE" : "OFFLINE";
        playBtn.disabled = !live;
        if (!live && playing) { stop(); }
      }

      function checkLive() {
        // /live/ renvoie 200 si en direct, 404 sinon
        fetch("https://api.mixcloud.com/" + USER + "/live/")
          .then(function (r) { setStatus(r.ok); })
          .catch(function () { setStatus(false); });
      }

      checkLive();
      setInterval(checkLive, 60000); // re-vérifie chaque minute
    })();
  </script>

</body>
</html>
