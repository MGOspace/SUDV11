<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDV11</title>
  <meta name="description" content="Site SUDV11">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header : ligne du bas noire, play + statut en haut à droite -->
  <header class="header">
    <button class="play-btn" id="playBtn" type="button" aria-label="Lancer le live">
      <span class="play-icon"></span>
    </button>
    <div class="status-box" id="statusBox"></div>
  </header>

  <!-- Second marquee : texte défilant depuis une channel Are.na -->
  <div class="ticker" id="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <main class="stage">
    <button class="planning-link" id="planningLink" type="button">PLANNING</button>
    <figure class="planning-figure" id="planningFigure" hidden>
      <img src="assets/planningia.png" alt="Planning de la semaine" loading="lazy">
    </figure>
    <h1 class="title">SUDV11</h1>
  </main>

  <!-- Player live monté ici (hors-écran) -->
  <div class="player-mount" id="playerMount"></div>

  <!-- Affichage / masquage du planning entre PLANNING et SUDV11 -->
  <script>
    (function () {
      var link = document.getElementById("planningLink");
      var figure = document.getElementById("planningFigure");

      link.addEventListener("click", function () {
        figure.hidden = !figure.hidden;
        link.classList.toggle("is-open", !figure.hidden);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !figure.hidden) {
          figure.hidden = true;
          link.classList.remove("is-open");
        }
      });
    })();
  </script>

  <!-- Live Mixcloud (M_GO) : la box reflète l'état réel du stream ; play si online -->
  <script>
    (function () {
      var USER = "M_GO";

      // URL du Cloudflare Worker (voir worker/mixcloud-live.js). Tant qu'elle
      // est vide, la détection auto est désactivée : le play reste possible et
      // la box suit l'état de lecture (repli, pour ne rien casser).
      var STATUS_ENDPOINT = "";

      var statusBox = document.getElementById("statusBox");
      var playBtn = document.getElementById("playBtn");
      var mount = document.getElementById("playerMount");
      var isOnline = false;   // stream Mixcloud réellement en ligne
      var playing = false;

      function setBadge(online) {
        statusBox.classList.toggle("is-live", online);
        statusBox.innerHTML = online
          ? '<span class="live-dot"></span>LIVE'
          : "OFFLINE";
      }

      function play() {
        if (STATUS_ENDPOINT && !isOnline) return; // pas de play si offline
        mount.innerHTML =
          '<iframe width="300" height="60" allow="autoplay" ' +
          'src="https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&mini=1&autoplay=1&feed=%2Flive%2F' +
          USER + '%2F"></iframe>';
        playing = true;
        playBtn.classList.add("is-playing");
        playBtn.setAttribute("aria-label", "Arrêter le live");
      }

      function stop() {
        mount.innerHTML = "";
        playing = false;
        playBtn.classList.remove("is-playing");
        playBtn.setAttribute("aria-label", "Lancer le live");
      }

      playBtn.addEventListener("click", function () {
        if (playing) { stop(); } else { play(); }
      });

      function setOnline(online) {
        isOnline = online;
        setBadge(online);
        playBtn.disabled = !online;         // play grisé si offline
        if (!online && playing) { stop(); } // coupe si le live s'arrête
      }

      // --- Repli sans Worker : play toujours possible, box = état de lecture ---
      if (!STATUS_ENDPOINT) {
        setBadge(false);
        playBtn.disabled = false;
        var _play = play, _stop = stop;
        play = function () { _play(); setBadge(true); };
        stop = function () { _stop(); setBadge(false); };
        return;
      }

      // --- Détection auto via le Worker ---
      setOnline(false); // état initial (offline tant qu'on n'a pas confirmé)

      function checkLive() {
        fetch(STATUS_ENDPOINT, { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (d) { setOnline(!!(d && d.live)); })
          .catch(function () { /* on garde le dernier état connu */ });
      }

      checkLive();
      setInterval(checkLive, 30000); // re-vérifie toutes les 30 s
    })();
  </script>

  <!-- Marquee Are.na : récupère les blocs texte d'une channel et les fait défiler -->
  <script>
    (function () {
      // Slug de la channel Are.na (are.na/m-go-lq0qmuopbtu/texte_sudv11)
      var CHANNEL = "texte_sudv11";
      var SPEED = 40; // px/seconde — plus petit = plus lent

      var track = document.getElementById("tickerTrack");

      function esc(s) {
        return s.replace(/[&<>"]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
        });
      }

      function build(items) {
        if (!items.length) items = ["SUDV11"];
        var unit = items.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("");
        track.innerHTML = unit + unit; // deux copies -> boucle sans coupure (-50%)
        // vitesse constante quel que soit le volume de texte
        var half = track.scrollWidth / 2;
        track.style.animationDuration = (half / SPEED) + "s";
      }

      if (!CHANNEL) { build([]); return; }

      fetch("https://api.are.na/v2/channels/" + CHANNEL + "/contents?per=100")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var texts = (d.contents || [])
            .filter(function (b) { return b.class === "Text"; })
            .map(function (b) { return (b.content || "").replace(/\s+/g, " ").trim(); })
            .filter(Boolean);
          build(texts);
        })
        .catch(function () { build([]); });
    })();
  </script>
